<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>โปรแกรมฝึกรูปเรขาคณิต 2D และ 3D ม.1</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../ads-style.css">
    <script src="../ads-script.js"></script>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --border-color: #333333;
            --text-main: #f5f5f5;
            --text-sub: #a0a0a0;
            --accent-cyan: #00d2ff;
            --accent-green: #28a745;
            --accent-red: #dc3545;
            --accent-yellow: #ffc107;
        }

        * {
            box-sizing: border-box;
            font-family: 'Kanit', sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 680px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 28px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.6);
        }

        h1 {
            text-align: center;
            font-size: 24px;
            margin-bottom: 20px;
            color: var(--accent-cyan);
        }

        /* เมนูหมวดหมู่ */
        .type-menu {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }

        .type-btn {
            padding: 12px 6px;
            background: #2a2a2a;
            color: #fff;
            border: 1px solid #444;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: 0.2s;
            text-align: center;
        }

        .type-btn:hover {
            background: #383838;
        }

        .type-btn.active {
            background: var(--accent-cyan);
            color: #000;
            font-weight: 700;
            border-color: var(--accent-cyan);
        }

        /* แสดงโจทย์ */
        .quiz-card {
            background: #181818;
            border: 1px solid #333;
            border-radius: 12px;
            padding: 30px 20px;
            text-align: center;
            margin-bottom: 20px;
        }

        .question-display {
            font-size: 22px;
            font-weight: 600;
            color: #fff;
            letter-spacing: 0.5px;
            margin-bottom: 20px;
            line-height: 1.6;
        }

        .input-group {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            font-size: 20px;
            font-weight: 600;
        }

        input[type="number"] {
            width: 140px;
            height: 48px;
            background: #2a2a2a;
            border: 2px solid #555;
            color: #fff;
            border-radius: 8px;
            font-size: 24px;
            font-weight: bold;
            text-align: center;
            outline: none;
            transition: 0.2s;
        }

        input:focus {
            border-color: var(--accent-cyan);
            background: #333;
        }

        /* ปุ่มควบคุม */
        .control-btns {
            display: flex;
            gap: 10px;
        }

        .btn {
            flex: 1;
            padding: 12px;
            border: 1px solid #555;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-check {
            background: #fff;
            color: #000;
        }

        .btn-check:hover {
            background: #e0e0e0;
        }

        .btn-reveal {
            background: #333;
            color: #fff;
        }

        .btn-reveal:hover {
            background: #444;
        }

        .btn-next {
            background: var(--accent-cyan);
            color: #000;
        }

        .btn-next:hover {
            opacity: 0.9;
        }

        /* ข้อความแจ้งเตือน / เฉลย */
        .feedback {
            margin-top: 15px;
            padding: 16px;
            border-radius: 8px;
            font-size: 15px;
            text-align: left;
            display: none;
            line-height: 1.8;
        }

        .feedback.correct {
            background: #1b382b;
            color: #85d7b0;
            border: 1px solid var(--accent-green);
        }

        .feedback.wrong {
            background: #4a282d;
            color: #f8a5ac;
            border: 1px solid var(--accent-red);
        }

        .feedback.solution {
            background: #2b281b;
            color: #d7ca85;
            border: 1px solid var(--accent-yellow);
        }

        .step-line {
            font-size: 15px;
            margin: 4px 0;
            color: #f0f0f0;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>📐 โปรแกรมฝึกรูปเรขาคณิต 2D & 3D (ม.1)</h1>

        <!-- เมนูเลือกรูปแบบโจทย์ -->
        <div class="type-menu">
            <button class="type-btn active" onclick="setType(1)">1. รูป 2 มิติ<br><small>(พื้นที่ &
                    ความยาวรอบรูป)</small></button>
            <button class="type-btn" onclick="setType(2)">2. ปริซึม 3 มิติ<br><small>(ปริมาตร &
                    พื้นที่ผิว)</small></button>
            <button class="type-btn" onclick="setType(3)">3. ทรงกระบอก 3 มิติ<br><small>(ปริมาตร &
                    พื้นที่ผิว)</small></button>
        </div>

        <!-- แสดงโจทย์ -->
        <div class="quiz-card">
            <div class="question-display" id="question-text">โจทย์กำลังโหลด...</div>

            <div class="input-group">
                <span id="prefix-label">คำตอบคือ:</span>
                <input type="number" id="userAns" step="any" placeholder="?"
                    onkeydown="if(event.key==='Enter') checkAnswer()">
                <span id="unit-label">ตร.ซม.</span>
            </div>
        </div>

        <!-- ปุ่มควบคุม -->
        <div class="control-btns">
            <button class="btn btn-check" onclick="checkAnswer()">✅ ตรวจคำตอบ</button>
            <button class="btn btn-reveal" onclick="revealSolution()">💡 วิธีคิด / เฉลย</button>
            <button class="btn btn-next" onclick="generateQuestion()">🎲 สุ่มโจทย์ใหม่</button>
        </div>

        <!-- กล่องแสดงข้อความ -->
        <div class="feedback" id="feedback-box"></div>
    </div>

    <script>
        let currentType = 1;
        let currentProblem = {};

        function setType(type) {
            currentType = type;
            const btns = document.querySelectorAll('.type-btn');
            btns.forEach((btn, i) => {
                btn.classList.toggle('active', i + 1 === type);
            });
            generateQuestion();
        }

        function getRandomInt(min, max) {
            return Math.floor(Math.random() * (max - min + 1)) + min;
        }

        function generateQuestion() {
            hideFeedback();
            document.getElementById('userAns').value = '';
            document.getElementById('userAns').focus();

            const unitEl = document.getElementById('unit-label');

            let exprStr = '';
            let steps = [];
            let ans = 0;

            if (currentType === 1) {
                // รูปแบบ 1: เรขาคณิต 2 มิติ (สามเหลี่ยม / สี่เหลี่ยมผืนผ้า / วงกลม)
                const shapeType = getRandomInt(1, 3);

                if (shapeType === 1) {
                    // สามเหลี่ยม
                    const base = getRandomInt(2, 10) * 2; // สุ่มเลขคู่เพื่อให้หาร 2 ลงตัว
                    const height = getRandomInt(3, 12);
                    ans = 0.5 * base * height;
                    unitEl.innerText = "ตร.ซม.";

                    exprStr = `สามเหลี่ยมรูปหนึ่งมีความยาวฐาน <b>${base} ซม.</b> และความสูง <b>${height} ซม.</b> <br>จงหา<b>พื้นที่ของสามเหลี่ยม</b>นี้`;

                    steps = [
                        `สูตรพื้นที่สามเหลี่ยม = ½ × ฐาน × สูง`,
                        `แทนค่า: ½ × ${base} × ${height}`,
                        `= ${0.5 * base} × ${height}`,
                        `<b>คำตอบคือ ${ans} ตารางเซนติเมตร</b>`
                    ];
                } else if (shapeType === 2) {
                    // สี่เหลี่ยมผืนผ้า (หาความยาวรอบรูป)
                    const w = getRandomInt(3, 15);
                    const l = getRandomInt(w + 1, 20);
                    ans = 2 * (w + l);
                    unitEl.innerText = "ซม.";

                    exprStr = `สี่เหลี่ยมผืนผ้ารูปหนึ่งมีความกว้าง <b>${w} ซม.</b> และความยาว <b>${l} ซม.</b> <br>จงหา<b>ความยาวรอบรูป</b>ของสี่เหลี่ยมนี้`;

                    steps = [
                        `สูตรความยาวรอบรูปสี่เหลี่ยมผืนผ้า = 2 × (กว้าง + ยาว)`,
                        `แทนค่า: 2 × (${w} + ${l})`,
                        `= 2 × ${w + l}`,
                        `<b>คำตอบคือ ${ans} เซนติเมตร</b>`
                    ];
                } else {
                    // วงกลม (กำหนด π = 22/7 หรือ 3.14)
                    const r = getRandomInt(1, 4) * 7; // สุ่มรัศมีเป็นทวีคูณของ 7
                    ans = (22 / 7) * r * r;
                    unitEl.innerText = "ตร.ซม.";

                    exprStr = `วงกลมรูปหนึ่งมีรัศมี <b>${r} ซม.</b> <br>จงหา<b>พื้นที่วงกลม</b> (กำหนดให้ π ≈ <sup>22</sup>/<sub>7</sub>)`;

                    steps = [
                        `สูตรพื้นที่วงกลม = π × r²`,
                        `แทนค่า: (<sup>22</sup>/<sub>7</sub>) × ${r} × ${r}`,
                        `= (<sup>22</sup>/<sub>7</sub>) × ${r * r}`,
                        `= 22 × ${r * r / 7}`,
                        `<b>คำตอบคือ ${ans} ตารางเซนติเมตร</b>`
                    ];
                }

            } else if (currentType === 2) {
                // รูปแบบ 2: ปริซึมสี่เหลี่ยมมุมฉาก (3 มิติ)
                const qType = getRandomInt(1, 2);
                const w = getRandomInt(2, 8);
                const l = getRandomInt(3, 10);
                const h = getRandomInt(4, 12);

                if (qType === 1) {
                    // หาปริมาตร
                    ans = w * l * h;
                    unitEl.innerText = "ลบ.ซม.";

                    exprStr = `ปริซึมสี่เหลี่ยมมุมฉาก มีความกว้าง <b>${w} ซม.</b> ยาว <b>${l} ซม.</b> และสูง <b>${h} ซม.</b> <br>จงหา<b>ปริมาตรของปริซึม</b>นี้`;

                    steps = [
                        `สูตรปริมาตรปริซึม = พื้นที่ฐาน × สูง (หรือ กว้าง × ยาว × สูง)`,
                        `แทนค่า: ${w} × ${l} × ${h}`,
                        `= ${w * l} × ${h}`,
                        `<b>คำตอบคือ ${ans} ลูกบาศก์เซนติเมตร</b>`
                    ];
                } else {
                    // หาพื้นที่ผิวทั้งหมด
                    ans = 2 * (w * l + w * h + l * h);
                    unitEl.innerText = "ตร.ซม.";

                    exprStr = `ทรงสี่เหลี่ยมมุมฉาก มีความกว้าง <b>${w} ซม.</b> ยาว <b>${l} ซม.</b> และสูง <b>${h} ซม.</b> <br>จงหา<b>พื้นที่ผิวทั้งหมด</b>`;

                    steps = [
                        `สูตรพื้นที่ผิวทรงสี่เหลี่ยมมุมฉาก = 2 × (กว้าง×ยาว + กว้าง×สูง + ยาว×สูง)`,
                        `แทนค่า: 2 × (${w}×${l} + ${w}×${h} + ${l}×${h})`,
                        `= 2 × (${w * l} + ${w * h} + ${l * h})`,
                        `= 2 × ${w * l + w * h + l * h}`,
                        `<b>คำตอบคือ ${ans} ตารางเซนติเมตร</b>`
                    ];
                }

            } else if (currentType === 3) {
                // รูปแบบ 3: ทรงกระบอก (3 มิติ)
                const r = getRandomInt(1, 3) * 7; // รัศมีเป็นทวีคูณของ 7
                const h = getRandomInt(2, 10);

                ans = (22 / 7) * r * r * h;
                unitEl.innerText = "ลบ.ซม.";

                exprStr = `ทรงกระบอกใบหนึ่งมีรัศมีฐาน <b>${r} ซม.</b> และมีความสูง <b>${h} ซม.</b> <br>จงหา<b>ปริมาตรทรงกระบอก</b> (กำหนดให้ π ≈ <sup>22</sup>/<sub>7</sub>)`;

                steps = [
                    `สูตรปริมาตรทรงกระบอก = π × r² × h`,
                    `แทนค่า: (<sup>22</sup>/<sub>7</sub>) × ${r}² × ${h}`,
                    `= (<sup>22</sup>/<sub>7</sub>) × ${r * r} × ${h}`,
                    `= 22 × ${r * r / 7} × ${h}`,
                    `<b>คำตอบคือ ${ans} ลูกบาศก์เซนติเมตร</b>`
                ];
            }

            currentProblem = { exprStr, ans, steps };
            document.getElementById('question-text').innerHTML = exprStr;
        }

        function checkAnswer() {
            const input = document.getElementById('userAns').value;
            if (input === '') return;

            const userAns = parseFloat(input);
            const fb = document.getElementById('feedback-box');
            fb.style.display = 'block';

            if (Math.abs(userAns - currentProblem.ans) < 0.01) {
                fb.className = 'feedback correct';
                fb.innerHTML = `🎉 <b>ถูกต้องเก่งมาก!</b> <br>คำตอบที่ถูกต้องคือ <b>${currentProblem.ans}</b>`;
            } else {
                fb.className = 'feedback wrong';
                fb.innerHTML = `❌ <b>ยังไม่ถูกต้อง</b> <br>คำตอบที่คุณกรอกคือ ${userAns} (ลองตรวจสอบสูตรและการคิดเลขอีกครั้งครับ)`;
            }
        }

        function revealSolution() {
            const fb = document.getElementById('feedback-box');
            fb.style.display = 'block';
            fb.className = 'feedback solution';

            let stepsHtml = currentProblem.steps.map(s => `<div class="step-line">• ${s}</div>`).join('');
            fb.innerHTML = `💡 <b>วิธีคิด / เฉลยขั้นตอน:</b><br>${stepsHtml}`;
        }

        function hideFeedback() {
            document.getElementById('feedback-box').style.display = 'none';
        }

        // เริ่มต้นโจทย์ข้อแรก
        generateQuestion();
    </script>

</body>

</html>
