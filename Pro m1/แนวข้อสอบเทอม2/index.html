<!DOCTYPE html>
<html lang="th">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>แนวข้อสอบคณิตศาสตร์ ม.1 เทอม 2</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Sarabun', sans-serif;
    }

    body {
      background-color: #f0fdf4;
      color: #1e293b;
      padding-bottom: 50px;
    }

    /* Header */
    .main-header {
      background-color: #00a66c;
      color: #ffffff;
      padding: 14px 0;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }

    .header-container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .header-brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .header-icon {
      width: 42px;
      height: 42px;
      background-color: #ffffff;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .header-icon svg {
      width: 26px;
      height: 26px;
      fill: #00a66c;
    }

    .header-title {
      font-size: 1.25rem;
      font-weight: 700;
    }

    .header-subtitle {
      font-size: 0.85rem;
      opacity: 0.9;
    }

    .yt-button {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background-color: #ffffff;
      color: #dc2626;
      padding: 8px 16px;
      border-radius: 20px;
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 700;
      transition: all 0.2s ease;
    }

    .yt-button:hover {
      background-color: #dc2626;
      color: #ffffff;
    }

    .yt-button svg {
      width: 22px;
      height: 22px;
      fill: currentColor;
    }

    /* Layout */
    .container {
      max-width: 1100px;
      margin: 24px auto 0;
      padding: 0 20px;
    }

    .control-card {
      background-color: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 16px;
      padding: 16px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }

    .select-group {
      flex: 1;
      min-width: 280px;
    }

    .select-label {
      font-size: 0.85rem;
      color: #64748b;
      font-weight: 600;
      margin-bottom: 6px;
    }

    .custom-select {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      background-color: #f8fafc;
      font-size: 0.95rem;
      font-weight: 600;
    }

    .stats-group {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .stat-item {
      text-align: center;
    }

    .stat-label {
      font-size: 0.8rem;
      color: #64748b;
    }

    .stat-value {
      font-size: 1.1rem;
      font-weight: 700;
    }

    .stat-value span {
      color: #00a66c;
      font-size: 1.3rem;
    }

    .divider {
      width: 1px;
      height: 32px;
      background-color: #e2e8f0;
    }

    .progress-bar-bg {
      height: 8px;
      background-color: #e2e8f0;
      border-radius: 4px;
      margin: 20px 0;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      width: 2%;
      background-color: #00a66c;
      transition: width 0.3s ease;
    }

    /* Question Card */
    .question-card {
      background-color: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 16px;
      padding: 28px;
    }

    .question-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .chapter-tag {
      background-color: #dcfce7;
      color: #166534;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
    }

    .status-tag {
      background-color: #f1f5f9;
      color: #64748b;
      padding: 6px 14px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 500;
    }

    .question-text {
      font-size: 1.2rem;
      font-weight: 700;
      margin-bottom: 24px;
    }

    .options-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .option-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px;
      border: 1.5px solid #e2e8f0;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.2s ease;
      background-color: #ffffff;
    }

    .option-item:hover {
      border-color: #00a66c;
      background-color: #f0fdf4;
    }

    .option-item.selected {
      border-color: #00a66c;
      background-color: #f0fdf4;
    }

    .option-item.correct {
      border-color: #16a34a !important;
      background-color: #dcfce7 !important;
      color: #15803d;
    }

    .option-item.wrong {
      border-color: #dc2626 !important;
      background-color: #fee2e2 !important;
      color: #b91c1c;
    }

    .option-item.disabled {
      pointer-events: none;
    }

    .radio-circle {
      width: 20px;
      height: 20px;
      border: 2px solid #cbd5e1;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .option-item.selected .radio-circle {
      border-color: #00a66c;
      border-width: 6px;
    }

    /* Action Buttons Area */
    .action-group {
      display: flex;
      gap: 12px;
      margin-top: 24px;
      flex-wrap: wrap;
    }

    .btn {
      padding: 12px 24px;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: 700;
      border: none;
      cursor: pointer;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .btn-submit {
      background-color: #00a66c;
      color: white;
    }

    .btn-submit:hover {
      background-color: #008f5d;
    }

    .btn-random {
      background-color: #3b82f6;
      color: white;
    }

    .btn-random:hover {
      background-color: #2563eb;
    }

    .btn-explain {
      background-color: #f59e0b;
      color: white;
      display: none;
    }

    .btn-explain:hover {
      background-color: #d97706;
    }

    .explanation-box {
      margin-top: 20px;
      padding: 16px 20px;
      background-color: #f8fafc;
      border-left: 4px solid #3b82f6;
      border-radius: 8px;
      display: none;
    }

    .explanation-title {
      font-weight: 700;
      color: #1e3a8a;
      margin-bottom: 6px;
    }

    .explanation-text {
      font-size: 0.95rem;
      color: #334155;
      line-height: 1.6;
    }
  </style>
</head>

<body>

  <header class="main-header">
    <div class="header-container">
      <div class="header-brand">
        <div class="header-icon">
          <svg viewBox="0 0 24 24">
            <path
              d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-2 14H7v-2h10v2zm0-4H7v-2h10v2zm0-4H7V7h10v2z" />
          </svg>
        </div>
        <div>
          <h1 class="header-title">แนวข้อสอบคณิตศาสตร์ ม.1 เทอม 2</h1>
          <p class="header-subtitle">ระบบฝึกทำข้อสอบ Interactive 50 ข้อ พร้อมเฉลยรายละเอียด</p>
        </div>
      </div>

      <a href="https://www.youtube.com/watch?v=Np8-wJKwsWo" target="_blank" rel="noopener noreferrer" class="yt-button">
        <svg viewBox="0 0 24 24">
          <path
            d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.816zM9.545 15.568V8.432L15.818 12l-6.273 3.568z" />
        </svg>
        <span>ดูติวเตอร์</span>
      </a>
    </div>
  </header>

  <main class="container">
    <div class="control-card">
      <div class="select-group">
        <div class="select-label">เลือกบทเรียนที่ต้องการทำ:</div>
        <select class="custom-select" id="chapter-select" onchange="filterQuestions()">
          <option value="all">ทำข้อสอบทั้งหมด (คละบทเรียน)</option>
          <option value="1">บทที่ 1 สมการเชิงเส้นตัวแปรเดียว</option>
          <option value="2">บทที่ 2 อัตราส่วน สัดส่วน และร้อยละ</option>
        </select>
      </div>

      <div class="stats-group">
        <div class="stat-item">
          <div class="stat-label">ข้อที่</div>
          <div class="stat-value"><span id="current-index">1</span> / <span id="total-count">50</span></div>
        </div>
        <div class="divider"></div>
        <div class="stat-item">
          <div class="stat-label">คะแนนรวม</div>
          <div class="stat-value"><span id="score-count">0</span> คะแนน</div>
        </div>
      </div>
    </div>

    <div class="progress-bar-bg">
      <div class="progress-bar-fill" id="progress-bar"></div>
    </div>

    <!-- Question Card -->
    <div class="question-card">
      <div class="question-header">
        <span class="chapter-tag" id="question-chapter">บทที่ 1 สมการเชิงเส้นตัวแปรเดียว</span>
        <span class="status-tag" id="question-status">ยังไม่ได้ตอบ</span>
      </div>

      <h2 class="question-text" id="question-title">กำลังโหลดโจทย์...</h2>

      <div class="options-list" id="options-container"></div>

      <!-- Action Buttons -->
      <div class="action-group">
        <button class="btn btn-submit" onclick="checkAnswer()">Check ตรวจคำตอบ</button>
        <button class="btn btn-random" onclick="loadRandomQuestion()">🎲 สุ่มโจทย์ข้อใหม่</button>
        <button class="btn btn-explain" id="btn-explain" onclick="toggleExplanation()">💡 ดูเฉลยละเอียด</button>
      </div>

      <!-- Explanation Box -->
      <div class="explanation-box" id="explanation-box">
        <div class="explanation-title">📌 เฉลยและวิธีทำอย่างละเอียด:</div>
        <div class="explanation-text" id="explanation-text"></div>
      </div>
    </div>
  </main>

  <script>
    // คลังโจทย์ตัวอย่าง (สามารถเพิ่มข้อสอบได้เรื่อยๆ)
    const questionBank = [
      {
        chapterId: 1,
        chapterName: "บทที่ 1 สมการเชิงเส้นตัวแปรเดียว",
        title: "ข้อใดต่อไปนี้เป็นสมการเชิงเส้นตัวแปรเดียว?",
        options: [
          "A) 2x + 3y = 7",
          "B) x² - 4 = 0",
          "C) 3x - 5 = 10",
          "D) 2x + 5 > 9"
        ],
        correctIndex: 2,
        explain: "สมการเชิงเส้นตัวแปรเดียว ต้องมีตัวแปรเดียว (x) และมีเลขชี้กำลังของตัวแปรเป็น 1 เท่านั้น<br>• ข้อ A มี 2 ตัวแปร (x, y)<br>• ข้อ B เลขชี้กำลังเป็น 2<br>• ข้อ D เป็นอสมการ (เครื่องหมาย >)<br>ดังนั้น ข้อ C) 3x - 5 = 10 จึงถูกต้อง"
      },
      {
        chapterId: 1,
        chapterName: "บทที่ 1 สมการเชิงเส้นตัวแปรเดียว",
        title: "ถ้า 2x + 8 = 20 แล้ว x มีค่าตรงกับข้อใด?",
        options: [
          "A) 4",
          "B) 6",
          "C) 8",
          "D) 10"
        ],
        correctIndex: 1,
        explain: "ย้าย 8 ไปลบออกจาก 20 จะได้ 2x = 12<br>จากนั้นย้าย 2 ไปหาร 12 จะได้ x = 6"
      },
      {
        chapterId: 2,
        chapterName: "บทที่ 2 อัตราส่วน สัดส่วน และร้อยละ",
        title: "อัตราส่วน 4 : 5 เท่ากับอัตราส่วนในข้อใด?",
        options: [
          "A) 8 : 10",
          "B) 12 : 20",
          "C) 16 : 25",
          "D) 20 : 30"
        ],
        correctIndex: 0,
        explain: "นำ 2 คูณทั้งจำนวนหน้าและจำนวนหลังของ 4 : 5 จะได้ (4×2) : (5×2) = 8 : 10"
      },
      {
        chapterId: 2,
        chapterName: "บทที่ 2 อัตราส่วน สัดส่วน และร้อยละ",
        title: "20% ของ 250 มีค่าเท่ากับเท่าใด?",
        options: [
          "A) 40",
          "B) 45",
          "C) 50",
          "D) 60"
        ],
        correctIndex: 2,
        explain: "คำนวณจาก (20 / 100) × 250 = 50"
      }
    ];

    let currentQuestion = null;
    let selectedOptionIndex = null;
    let totalScore = 0;
    let isChecked = false;
    let currentIndexNum = 1;

    function loadRandomQuestion() {
      const selectedChapter = document.getElementById('chapter-select').value;
      let availableQuestions = questionBank;

      if (selectedChapter !== 'all') {
        availableQuestions = questionBank.filter(q => q.chapterId == selectedChapter);
      }

      if (availableQuestions.length === 0) {
        alert("ไม่พบโจทย์ในบทเรียนนี้");
        return;
      }

      // สุ่มข้อสอบ
      const randomIndex = Math.floor(Math.random() * availableQuestions.length);
      currentQuestion = availableQuestions[randomIndex];

      // รีเซ็ตสถานะหน้าจอ
      selectedOptionIndex = null;
      isChecked = false;

      document.getElementById('question-chapter').innerText = currentQuestion.chapterName;
      document.getElementById('question-title').innerText = `${currentIndexNum}. ${currentQuestion.title}`;
      document.getElementById('question-status').innerText = 'ยังไม่ได้ตอบ';
      document.getElementById('question-status').style.backgroundColor = '#f1f5f9';
      document.getElementById('question-status').style.color = '#64748b';

      document.getElementById('btn-explain').style.display = 'none';
      document.getElementById('explanation-box').style.display = 'none';

      // สร้างตัวเลือก Options
      const container = document.getElementById('options-container');
      container.innerHTML = '';

      currentQuestion.options.forEach((optText, index) => {
        const item = document.createElement('label');
        item.className = 'option-item';
        item.onclick = () => selectOption(index);
        item.innerHTML = `
          <span class="option-text">${optText}</span>
          <div class="radio-circle"></div>
        `;
        container.appendChild(item);
      });
    }

    function selectOption(index) {
      if (isChecked) return; // ถ้าตรวจคำตอบแล้วห้ามเปลี่ยน

      selectedOptionIndex = index;
      const items = document.querySelectorAll('.option-item');
      items.forEach((item, idx) => {
        if (idx === index) {
          item.classList.add('selected');
        } else {
          item.classList.remove('selected');
        }
      });

      document.getElementById('question-status').innerText = 'ตอบแล้ว';
      document.getElementById('question-status').style.backgroundColor = '#e0f2fe';
      document.getElementById('question-status').style.color = '#0369a1';
    }

    function checkAnswer() {
      if (selectedOptionIndex === null) {
        alert("กรุณาเลือกคำตอบก่อนกดตรวจครับ!");
        return;
      }

      if (isChecked) return; // ตรวจแล้วไม่ต้องตรวจซ้ำ
      isChecked = true;

      const items = document.querySelectorAll('.option-item');
      items.forEach(item => item.classList.add('disabled'));

      const isCorrect = (selectedOptionIndex === currentQuestion.correctIndex);

      if (isCorrect) {
        items[selectedOptionIndex].classList.add('correct');
        totalScore += 1;
        document.getElementById('score-count').innerText = totalScore;
        document.getElementById('question-status').innerText = 'ถูกต้อง! (+1)';
        document.getElementById('question-status').style.backgroundColor = '#dcfce7';
        document.getElementById('question-status').style.color = '#166534';
      } else {
        items[selectedOptionIndex].classList.add('wrong');
        items[currentQuestion.correctIndex].classList.add('correct');
        document.getElementById('question-status').innerText = 'ตอบผิด';
        document.getElementById('question-status').style.backgroundColor = '#fee2e2';
        document.getElementById('question-status').style.color = '#991b1b';
      }

      // แสดงปุ่มเฉลยละเอียด
      document.getElementById('btn-explain').style.display = 'inline-flex';
      document.getElementById('explanation-text').innerHTML = currentQuestion.explain;

      // อัปเดตข้อถัดไป
      currentIndexNum = (currentIndexNum % 50) + 1;
      document.getElementById('current-index').innerText = currentIndexNum;
      document.getElementById('progress-bar').style.width = `${(currentIndexNum / 50) * 100}%`;
    }

    function toggleExplanation() {
      const box = document.getElementById('explanation-box');
      box.style.display = (box.style.display === 'block') ? 'none' : 'block';
    }

    function filterQuestions() {
      loadRandomQuestion();
    }

    // เริ่มต้นทำงานทันทีเมื่อเปิดหน้า
    window.onload = loadRandomQuestion;
  </script>
</body>

</html>
