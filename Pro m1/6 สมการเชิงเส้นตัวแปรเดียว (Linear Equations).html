<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>โปรแกรมฝึกแก้สมการเชิงเส้นตัวแปรเดียว ม.1</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../ads-style.css">
    <script src="../ads-script.js"></script>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --border-color: #333333;
            --text-main: #f5f5f5;
            --text-sub: #a0a0a0;
            --accent-cyan: #00d2ff;
            --accent-green: #28a745;
            --accent-red: #dc3545;
            --accent-yellow: #ffc107;
        }

        * {
            box-sizing: border-box;
            font-family: 'Kanit', sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 680px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 28px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.6);
        }

        h1 {
            text-align: center;
            font-size: 24px;
            margin-bottom: 20px;
            color: var(--accent-cyan);
        }

        /* เมนูรูปแบบสมการ */
        .type-menu {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin-bottom: 20px;
        }

        .type-btn {
            padding: 10px 4px;
            background: #2a2a2a;
            color: #fff;
            border: 1px solid #444;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: 0.2s;
            text-align: center;
        }

        .type-btn:hover {
            background: #383838;
        }

        .type-btn.active {
            background: var(--accent-cyan);
            color: #000;
            font-weight: 700;
            border-color: var(--accent-cyan);
        }

        /* การแสดงผลโจทย์ */
        .quiz-card {
            background: #181818;
            border: 1px solid #333;
            border-radius: 12px;
            padding: 30px 20px;
            text-align: center;
            margin-bottom: 20px;
        }

        .question-display {
            font-size: 34px;
            font-weight: 700;
            color: #fff;
            letter-spacing: 1px;
            margin-bottom: 20px;
        }

        .input-group {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            font-size: 24px;
            font-weight: 600;
        }

        input[type="number"] {
            width: 120px;
            height: 50px;
            background: #2a2a2a;
            border: 2px solid #555;
            color: #fff;
            border-radius: 8px;
            font-size: 26px;
            font-weight: bold;
            text-align: center;
            outline: none;
            transition: 0.2s;
        }

        input[type="number"]:focus {
            border-color: var(--accent-cyan);
            background: #333;
        }

        /* ปุ่มควบคุม */
        .control-btns {
            display: flex;
            gap: 10px;
        }

        .btn {
            flex: 1;
            padding: 12px;
            border: 1px solid #555;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-check {
            background: #fff;
            color: #000;
        }

        .btn-check:hover {
            background: #e0e0e0;
        }

        .btn-reveal {
            background: #333;
            color: #fff;
        }

        .btn-reveal:hover {
            background: #444;
        }

        .btn-next {
            background: var(--accent-cyan);
            color: #000;
        }

        .btn-next:hover {
            opacity: 0.9;
        }

        /* ข้อความแจ้งเตือน / เฉลย */
        .feedback {
            margin-top: 15px;
            padding: 16px;
            border-radius: 8px;
            font-size: 15px;
            text-align: left;
            display: none;
            line-height: 1.8;
        }

        .feedback.correct {
            background: #1b382b;
            color: #85d7b0;
            border: 1px solid var(--accent-green);
        }

        .feedback.wrong {
            background: #4a282d;
            color: #f8a5ac;
            border: 1px solid var(--accent-red);
        }

        .feedback.solution {
            background: #2b281b;
            color: #d7ca85;
            border: 1px solid var(--accent-yellow);
        }

        .step-line {
            font-family: monospace;
            font-size: 16px;
            margin: 4px 0;
            color: #f0f0f0;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>📐 โปรแกรมฝึกแก้สมการเชิงเส้นตัวแปรเดียว (ม.1)</h1>

        <!-- เมนูเลือกรูปแบบสมการ -->
        <div class="type-menu">
            <button class="type-btn active" onclick="setType(1)">1. ย้าย 1 ขั้น<br><small>(x + a = b)</small></button>
            <button class="type-btn" onclick="setType(2)">2. ย้าย 2 ขั้น<br><small>(ax + b = c)</small></button>
            <button class="type-btn" onclick="setType(3)">3. ตัวแปร 2 ฝั่ง<br><small>(ax + b = cx + d)</small></button>
            <button class="type-btn" onclick="setType(4)">4. แบบมีวงเล็บ<br><small>a(x + b) = c</small></button>
        </div>

        <!-- แสดงโจทย์ -->
        <div class="quiz-card">
            <div class="question-display" id="question-text">2x + 5 = 13</div>

            <div class="input-group">
                <span>x =</span>
                <input type="number" id="userAns" placeholder="?" onkeydown="if(event.key==='Enter') checkAnswer()">
            </div>
        </div>

        <!-- ปุ่มควบคุม -->
        <div class="control-btns">
            <button class="btn btn-check" onclick="checkAnswer()">✅ ตรวจคำตอบ</button>
            <button class="btn btn-reveal" onclick="revealSolution()">💡 วิธีคิด / เฉลย</button>
            <button class="btn btn-next" onclick="generateQuestion()">🎲 สุ่มโจทย์ใหม่</button>
        </div>

        <!-- กล่องแสดงข้อความ -->
        <div class="feedback" id="feedback-box"></div>
    </div>

    <script>
        let currentType = 1;
        let currentProblem = {};

        function setType(type) {
            currentType = type;
            const btns = document.querySelectorAll('.type-btn');
            btns.forEach((btn, i) => {
                btn.classList.toggle('active', i + 1 === type);
            });
            generateQuestion();
        }

        // สุ่มตัวเลขที่ไม่ใช่ 0
        function getRandomNonZero(min, max) {
            let val = 0;
            while (val === 0) {
                val = Math.floor(Math.random() * (max - min + 1)) + min;
            }
            return val;
        }

        function generateQuestion() {
            hideFeedback();
            document.getElementById('userAns').value = '';
            document.getElementById('userAns').focus();

            let exprStr = '';
            let steps = [];
            let ansX = getRandomNonZero(-10, 10); // กำหนดคำตอบเป็นจำนวนเต็มเสมอ

            if (currentType === 1) {
                // รูปแบบ 1: x + b = c หรือ x - b = c
                const b = getRandomNonZero(-15, 15);
                const c = ansX + b;

                const bSign = b > 0 ? `+ ${b}` : `- ${Math.abs(b)}`;
                exprStr = `x ${bSign} = ${c}`;

                steps = [
                    `โจทย์: ${exprStr}`,
                    b > 0 ? `นำ ${b} ไปลบทั้งสองข้างของสมการ:` : `นำ ${Math.abs(b)} ไปบวกทั้งสองข้างของสมการ:`,
                    `x = ${c} ${b > 0 ? `- ${b}` : `+ ${Math.abs(b)}`}`,
                    `x = ${ansX}`
                ];

            } else if (currentType === 2) {
                // รูปแบบ 2: ax + b = c
                const a = getRandomNonZero(2, 6);
                const b = getRandomNonZero(-12, 12);
                const c = (a * ansX) + b;

                const bSign = b > 0 ? `+ ${b}` : `- ${Math.abs(b)}`;
                exprStr = `${a}x ${bSign} = ${c}`;

                const axVal = c - b;
                steps = [
                    `โจทย์: ${exprStr}`,
                    b > 0 ? `ย้าย ${b} ไปลบทางขวา:` : `ย้าย ${Math.abs(b)} ไปบวกทางขวา:`,
                    `${a}x = ${c} ${b > 0 ? `- ${b}` : `+ ${Math.abs(b)}`}`,
                    `${a}x = ${axVal}`,
                    `นำ ${a} ไปหารทั้งสองข้าง:`,
                    `x = ${axVal} / ${a}`,
                    `x = ${ansX}`
                ];

            } else if (currentType === 3) {
                // รูปแบบ 3: ax + b = cx + d
                let a = getRandomNonZero(2, 7);
                let c = getRandomNonZero(1, 5);
                while (a === c) { c = getRandomNonZero(1, 5); } // กันไม่ให้ a - c = 0

                const b = getRandomNonZero(-10, 10);
                const d = ((a - c) * ansX) + b;

                const bSign = b > 0 ? `+ ${b}` : `- ${Math.abs(b)}`;
                const dSign = d > 0 ? `+ ${d}` : `- ${Math.abs(d)}`;
                exprStr = `${a}x ${bSign} = ${c}x ${dSign}`;

                const leftA = a - c;
                const rightConst = d - b;
                steps = [
                    `โจทย์: ${exprStr}`,
                    `ย้ายพจน์ที่มี x ไปไว้ฝั่งซ้าย และตัวเลขไปฝั่งขวา:`,
                    `${a}x - ${c}x = ${d} ${b > 0 ? `- ${b}` : `+ ${Math.abs(b)}`}`,
                    `${leftA}x = ${rightConst}`,
                    `นำ ${leftA} ไปหารทั้งสองข้าง:`,
                    `x = ${rightConst} / ${leftA}`,
                    `x = ${ansX}`
                ];

            } else if (currentType === 4) {
                // รูปแบบ 4: a(x + b) = c
                const a = getRandomNonZero(2, 5);
                const b = getRandomNonZero(-8, 8);
                const inner = ansX + b;
                const c = a * inner;

                const bSign = b > 0 ? `+ ${b}` : `- ${Math.abs(b)}`;
                exprStr = `${a}(x ${bSign}) = ${c}`;

                steps = [
                    `โจทย์: ${exprStr}`,
                    `วิธีที่ 1: กระจาย ${a} เข้าไปในวงเล็บ`,
                    `${a}x ${a * b > 0 ? `+ ${a * b}` : `- ${Math.abs(a * b)}`} = ${c}`,
                    `${a}x = ${c} ${a * b > 0 ? `- ${a * b}` : `+ ${Math.abs(a * b)}`}`,
                    `${a}x = ${a * ansX}`,
                    `x = ${ansX}`
                ];
            }

            currentProblem = { exprStr, ansX, steps };
            document.getElementById('question-text').innerHTML = exprStr;
        }

        function checkAnswer() {
            const input = document.getElementById('userAns').value;
            if (input === '') return;

            const userAns = parseInt(input);
            const fb = document.getElementById('feedback-box');
            fb.style.display = 'block';

            if (userAns === currentProblem.ansX) {
                fb.className = 'feedback correct';
                fb.innerHTML = `🎉 <b>ถูกต้องเก่งมาก!</b> <br>คำตอบของสมการคือ <b>x = ${currentProblem.ansX}</b>`;
            } else {
                fb.className = 'feedback wrong';
                fb.innerHTML = `❌ <b>ยังไม่ถูกต้อง</b> <br>คำตอบที่คุณกรอกคือ x = ${userAns} (ลองตรวจเช็กลำดับการย้ายข้าง หรือเครื่องหมายบวก/ลบ อีกครั้งครับ)`;
            }
        }

        function revealSolution() {
            const fb = document.getElementById('feedback-box');
            fb.style.display = 'block';
            fb.className = 'feedback solution';

            let stepsHtml = currentProblem.steps.map(s => `<div class="step-line">• ${s}</div>`).join('');
            fb.innerHTML = `💡 <b>วิธีทำทีละขั้นตอน:</b><br>${stepsHtml}`;
        }

        function hideFeedback() {
            document.getElementById('feedback-box').style.display = 'none';
        }

        // เริ่มต้นโจทย์ข้อแรก
        generateQuestion();
    </script>

</body>

</html>
