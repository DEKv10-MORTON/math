<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>โปรแกรมฝึกเลขยกกำลัง ม.1 (Exponents Practice)</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../ads-style.css">
    <script src="../ads-script.js"></script>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --border-color: #333333;
            --text-main: #f5f5f5;
            --text-sub: #a0a0a0;
            --accent-cyan: #00d2ff;
            --accent-green: #28a745;
            --accent-red: #dc3545;
            --accent-yellow: #ffc107;
        }

        * {
            box-sizing: border-box;
            font-family: 'Kanit', sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 680px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 28px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.6);
        }

        h1 {
            text-align: center;
            font-size: 24px;
            margin-bottom: 20px;
            color: var(--accent-cyan);
        }

        /* เมนูหมวดหมู่ */
        .type-menu {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }

        .type-btn {
            padding: 12px 6px;
            background: #2a2a2a;
            color: #fff;
            border: 1px solid #444;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: 0.2s;
            text-align: center;
        }

        .type-btn:hover {
            background: #383838;
        }

        .type-btn.active {
            background: var(--accent-cyan);
            color: #000;
            font-weight: 700;
            border-color: var(--accent-cyan);
        }

        /* แสดงโจทย์ */
        .quiz-card {
            background: #181818;
            border: 1px solid #333;
            border-radius: 12px;
            padding: 30px 20px;
            text-align: center;
            margin-bottom: 20px;
        }

        .question-display {
            font-size: 32px;
            font-weight: 700;
            color: #fff;
            letter-spacing: 1px;
            margin-bottom: 20px;
            line-height: 1.6;
        }

        .input-group {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            font-size: 22px;
            font-weight: 600;
        }

        input[type="number"] {
            width: 140px;
            height: 50px;
            background: #2a2a2a;
            border: 2px solid #555;
            color: #fff;
            border-radius: 8px;
            font-size: 26px;
            font-weight: bold;
            text-align: center;
            outline: none;
            transition: 0.2s;
        }

        input[type="number"]:focus {
            border-color: var(--accent-cyan);
            background: #333;
        }

        /* ปุ่มควบคุม */
        .control-btns {
            display: flex;
            gap: 10px;
        }

        .btn {
            flex: 1;
            padding: 12px;
            border: 1px solid #555;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-check {
            background: #fff;
            color: #000;
        }

        .btn-check:hover {
            background: #e0e0e0;
        }

        .btn-reveal {
            background: #333;
            color: #fff;
        }

        .btn-reveal:hover {
            background: #444;
        }

        .btn-next {
            background: var(--accent-cyan);
            color: #000;
        }

        .btn-next:hover {
            opacity: 0.9;
        }

        /* ข้อความแจ้งเตือน / เฉลย */
        .feedback {
            margin-top: 15px;
            padding: 16px;
            border-radius: 8px;
            font-size: 15px;
            text-align: left;
            display: none;
            line-height: 1.8;
        }

        .feedback.correct {
            background: #1b382b;
            color: #85d7b0;
            border: 1px solid var(--accent-green);
        }

        .feedback.wrong {
            background: #4a282d;
            color: #f8a5ac;
            border: 1px solid var(--accent-red);
        }

        .feedback.solution {
            background: #2b281b;
            color: #d7ca85;
            border: 1px solid var(--accent-yellow);
        }

        .step-line {
            font-size: 15px;
            margin: 4px 0;
            color: #f0f0f0;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>⚡ โปรแกรมฝึกคำนวณเลขยกกำลัง (ม.1)</h1>

        <!-- เมนูเลือกรูปแบบโจทย์ -->
        <div class="type-menu">
            <button class="type-btn active" onclick="setType(1)">1. หาค่าสำเร็จ<br><small>(a<sup>n</sup> =
                    ?)</small></button>
            <button class="type-btn" onclick="setType(2)">2. คูณ/หาร เลขชี้กำลัง<br><small>(a<sup>m</sup> ×
                    a<sup>n</sup> หรือ ÷)</small></button>
            <button class="type-btn" onclick="setType(3)">3. สัญกรณ์วิทยาศาสตร์<br><small>(A ×
                    10<sup>n</sup>)</small></button>
        </div>

        <!-- แสดงโจทย์ -->
        <div class="quiz-card">
            <div class="question-display" id="question-text">โจทย์กำลังโหลด...</div>

            <div class="input-group">
                <span id="prefix-label">คำตอบคือ:</span>
                <input type="number" id="userAns" placeholder="?" onkeydown="if(event.key==='Enter') checkAnswer()">
                <span id="suffix-label"></span>
            </div>
        </div>

        <!-- ปุ่มควบคุม -->
        <div class="control-btns">
            <button class="btn btn-check" onclick="checkAnswer()">✅ ตรวจคำตอบ</button>
            <button class="btn btn-reveal" onclick="revealSolution()">💡 วิธีคิด / เฉลย</button>
            <button class="btn btn-next" onclick="generateQuestion()">🎲 สุ่มโจทย์ใหม่</button>
        </div>

        <!-- กล่องแสดงข้อความ -->
        <div class="feedback" id="feedback-box"></div>
    </div>

    <script>
        let currentType = 1;
        let currentProblem = {};

        function setType(type) {
            currentType = type;
            const btns = document.querySelectorAll('.type-btn');
            btns.forEach((btn, i) => {
                btn.classList.toggle('active', i + 1 === type);
            });
            generateQuestion();
        }

        function getRandomInt(min, max) {
            return Math.floor(Math.random() * (max - min + 1)) + min;
        }

        function generateQuestion() {
            hideFeedback();
            document.getElementById('userAns').value = '';
            document.getElementById('userAns').focus();

            const prefixEl = document.getElementById('prefix-label');
            const suffixEl = document.getElementById('suffix-label');
            prefixEl.innerText = "คำตอบคือ:";
            suffixEl.innerText = "";

            let exprStr = '';
            let steps = [];
            let ans = 0;

            if (currentType === 1) {
                // รูปแบบ 1: หาค่าเลขยกกำลัง (รองรับฐานที่เป็นทั้งบวกและติดลบ)
                const base = getRandomInt(-5, 6) || 2; // สุ่มฐาน (-5 ถึง 6 เว้น 0)
                const exp = getRandomInt(2, 4);        // สุ่มกำลัง (2 ถึง 4)

                ans = Math.pow(base, exp);

                const baseStr = base < 0 ? `(${base})` : `${base}`;
                exprStr = `จงหาค่าของ ${baseStr}<sup>${exp}</sup>`;

                let expandedArr = [];
                for (let i = 0; i < exp; i++) expandedArr.push(baseStr);

                steps = [
                    `โจทย์: ${baseStr}<sup>${exp}</sup>`,
                    `ความหมาย: การนำฐานคูณกันทั้งหมด ${exp} ตัว`,
                    `เขียนกระจาย: ${expandedArr.join(' × ')}`,
                    base < 0 ? (exp % 2 === 0 ? `• ฐานติดลบ ยกกำลังเลขคู่ จะได้ผลลัพธ์เป็น **จำนวนบวก**` : `• ฐานติดลบ ยกกำลังเลขโพลก (เลขคี่) จะได้ผลลัพธ์เป็น **จำนวนติดลบ**`) : '',
                    `<b>คำตอบคือ ${ans}</b>`
                ].filter(s => s !== '');

            } else if (currentType === 2) {
                // รูปแบบ 2: สมบัติคูณ/หาร เลขยกกำลังฐานเดียวกัน (ตอบเป็นเลขชี้กำลัง n)
                const base = getRandomInt(2, 9);
                const m = getRandomInt(2, 8);
                const n = getRandomInt(1, 5);
                const isMultiply = Math.random() < 0.5;

                if (isMultiply) {
                    ans = m + n;
                    exprStr = `${base}<sup>${m}</sup> × ${base}<sup>${n}</sup> = ${base}<sup>n</sup><br> จงหาค่าของ n`;
                    steps = [
                        `ใช้สมบัติการคูณเลขยกกำลัง: a<sup>m</sup> × a<sup>n</sup> = a<sup>m + n</sup>`,
                        `ฐานเหมือนกัน (${base}) นำเลขชี้กำลังมาบวกกัน:`,
                        `n = ${m} + ${n}`,
                        `<b>n = ${ans}</b> (จะได้คำตอบคือ ${base}<sup>${ans}</sup>)`
                    ];
                } else {
                    // การหาร
                    const bigM = m + n; // ให้มงลงที่ตัวตั้งมากกว่าเสมอ เพื่อไม่ให้กำลังติดลบ
                    ans = bigM - n;
                    exprStr = `${base}<sup>${bigM}</sup> ÷ ${base}<sup>${n}</sup> = ${base}<sup>n</sup><br> จงหาค่าของ n`;
                    steps = [
                        `ใช้สมบัติการหารเลขยกกำลัง: a<sup>m</sup> ÷ a<sup>n</sup> = a<sup>m - n</sup>`,
                        `ฐานเหมือนกัน (${base}) นำเลขชี้กำลังมาลบกัน:`,
                        `n = ${bigM} - ${n}`,
                        `<b>n = ${ans}</b> (จะได้คำตอบคือ ${base}<sup>${ans}</sup>)`
                    ];
                }
                prefixEl.innerText = "n =";

            } else if (currentType === 3) {
                // รูปแบบ 3: สัญกรณ์วิทยาศาสตร์ เปลี่ยน A × 10^n ให้เป็นจำนวนเต็ม
                const A = getRandomInt(1, 9);
                const n = getRandomInt(2, 5);

                ans = A * Math.pow(10, n);
                exprStr = `เขียน <b>${A} × 10<sup>${n}</sup></b> ให้อยู่ในรูปจำนวนเต็ม`;

                steps = [
                    `โจทย์: ${A} × 10<sup>${n}</sup>`,
                    `10<sup>${n}</sup> มีค่าเท่ากับ ${Math.pow(10, n).toLocaleString()}`,
                    `นำมาคูณกัน: ${A} × ${Math.pow(10, n).toLocaleString()}`,
                    `<b>= ${ans.toLocaleString()}</b>`
                ];
            }

            currentProblem = { exprStr, ans, steps };
            document.getElementById('question-text').innerHTML = exprStr;
        }

        function checkAnswer() {
            const input = document.getElementById('userAns').value;
            if (input === '') return;

            const userAns = parseFloat(input);
            const fb = document.getElementById('feedback-box');
            fb.style.display = 'block';

            if (userAns === currentProblem.ans) {
                fb.className = 'feedback correct';
                fb.innerHTML = `🎉 <b>ถูกต้องเก่งมาก!</b> <br>คำตอบที่ถูกต้องคือ <b>${currentProblem.ans}</b>`;
            } else {
                fb.className = 'feedback wrong';
                fb.innerHTML = `❌ <b>ยังไม่ถูกต้อง</b> <br>คำตอบที่คุณกรอกคือ ${userAns} (ลองตรวจสอบเรื่องเครื่องหมายหรือการนำเลขชี้กำลังมาบวก/ลบ อีกครั้งครับ)`;
            }
        }

        function revealSolution() {
            const fb = document.getElementById('feedback-box');
            fb.style.display = 'block';
            fb.className = 'feedback solution';

            let stepsHtml = currentProblem.steps.map(s => `<div class="step-line">• ${s}</div>`).join('');
            fb.innerHTML = `💡 <b>วิธีคิด / เฉลยขั้นตอน:</b><br>${stepsHtml}`;
        }

        function hideFeedback() {
            document.getElementById('feedback-box').style.display = 'none';
        }

        // เริ่มต้นโจทย์ข้อแรก
        generateQuestion();
    </script>

</body>

</html>
