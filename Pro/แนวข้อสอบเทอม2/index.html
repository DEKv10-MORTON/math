<!DOCTYPE html>
<html lang="th">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>แนวข้อสอบคณิตศาสตร์ ม.2 เทอม 2 (50 ข้อ)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Sarabun', sans-serif;
    }

    body {
      background-color: #f0fdf4;
      color: #1e293b;
      padding-bottom: 50px;
    }

    .main-header {
      background-color: #00a66c;
      color: #ffffff;
      padding: 14px 0;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }

    .header-container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .header-brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .header-icon {
      width: 42px;
      height: 42px;
      background-color: #ffffff;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .header-icon svg {
      width: 26px;
      height: 26px;
      fill: #00a66c;
    }

    .header-title {
      font-size: 1.25rem;
      font-weight: 700;
    }

    .header-subtitle {
      font-size: 0.85rem;
      opacity: 0.9;
    }

    .yt-button {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background-color: #ffffff;
      color: #dc2626;
      padding: 8px 16px;
      border-radius: 20px;
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 700;
      transition: all 0.2s ease;
    }

    .yt-button:hover {
      background-color: #dc2626;
      color: #ffffff;
    }

    .yt-button svg {
      width: 22px;
      height: 22px;
      fill: currentColor;
    }

    .container {
      max-width: 1100px;
      margin: 24px auto 0;
      padding: 0 20px;
    }

    .control-card {
      background-color: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 16px;
      padding: 16px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }

    .select-group {
      flex: 1;
      min-width: 280px;
    }

    .select-label {
      font-size: 0.85rem;
      color: #64748b;
      font-weight: 600;
      margin-bottom: 6px;
    }

    .custom-select {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      background-color: #f8fafc;
      font-size: 0.95rem;
      font-weight: 600;
    }

    .stats-group {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .stat-item {
      text-align: center;
    }

    .stat-label {
      font-size: 0.8rem;
      color: #64748b;
    }

    .stat-value {
      font-size: 1.1rem;
      font-weight: 700;
    }

    .stat-value span {
      color: #00a66c;
      font-size: 1.3rem;
    }

    .divider {
      width: 1px;
      height: 32px;
      background-color: #e2e8f0;
    }

    .progress-bar-bg {
      height: 8px;
      background-color: #e2e8f0;
      border-radius: 4px;
      margin: 20px 0;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      width: 2%;
      background-color: #00a66c;
      transition: width 0.3s ease;
    }

    .question-card {
      background-color: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 16px;
      padding: 28px;
    }

    .question-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .chapter-tag {
      background-color: #dcfce7;
      color: #166534;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
    }

    .status-tag {
      background-color: #f1f5f9;
      color: #64748b;
      padding: 6px 14px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 500;
    }

    .question-text {
      font-size: 1.2rem;
      font-weight: 700;
      margin-bottom: 24px;
    }

    .options-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .option-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px;
      border: 1.5px solid #e2e8f0;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.2s ease;
      background-color: #ffffff;
    }

    .option-item:hover {
      border-color: #00a66c;
      background-color: #f0fdf4;
    }

    .option-item.selected {
      border-color: #00a66c;
      background-color: #f0fdf4;
    }

    .option-item.correct {
      border-color: #16a34a !important;
      background-color: #dcfce7 !important;
      color: #15803d;
    }

    .option-item.wrong {
      border-color: #dc2626 !important;
      background-color: #fee2e2 !important;
      color: #b91c1c;
    }

    .option-item.disabled {
      pointer-events: none;
    }

    .radio-circle {
      width: 20px;
      height: 20px;
      border: 2px solid #cbd5e1;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .option-item.selected .radio-circle {
      border-color: #00a66c;
      border-width: 6px;
    }

    .action-group {
      display: flex;
      gap: 12px;
      margin-top: 24px;
      flex-wrap: wrap;
    }

    .btn {
      padding: 12px 24px;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: 700;
      border: none;
      cursor: pointer;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .btn-submit {
      background-color: #00a66c;
      color: white;
    }

    .btn-submit:hover {
      background-color: #008f5d;
    }

    .btn-random {
      background-color: #3b82f6;
      color: white;
    }

    .btn-random:hover {
      background-color: #2563eb;
    }

    .btn-explain {
      background-color: #f59e0b;
      color: white;
      display: none;
    }

    .btn-explain:hover {
      background-color: #d97706;
    }

    .explanation-box {
      margin-top: 20px;
      padding: 16px 20px;
      background-color: #f8fafc;
      border-left: 4px solid #3b82f6;
      border-radius: 8px;
      display: none;
    }

    .explanation-title {
      font-weight: 700;
      color: #1e3a8a;
      margin-bottom: 6px;
    }

    .explanation-text {
      font-size: 0.95rem;
      color: #334155;
      line-height: 1.6;
    }
  </style>
</head>

<body>

  <header class="main-header">
    <div class="header-container">
      <div class="header-brand">
        <div class="header-icon">
          <svg viewBox="0 0 24 24">
            <path
              d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-2 14H7v-2h10v2zm0-4H7v-2h10v2zm0-4H7V7h10v2z" />
          </svg>
        </div>
        <div>
          <h1 class="header-title">แนวข้อสอบคณิตศาสตร์ ม.2 เทอม 2</h1>
          <p class="header-subtitle">ระบบฝึกทำข้อสอบ Interactive 50 ข้อ พร้อมเฉลยรายละเอียด</p>
        </div>
      </div>

      <a href="https://www.youtube.com/watch?v=K1s7huLrNIw" target="_blank" rel="noopener noreferrer" class="yt-button">
        <svg viewBox="0 0 24 24">
          <path
            d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.816zM9.545 15.568V8.432L15.818 12l-6.273 3.568z" />
        </svg>
        <span>ดูติวเตอร์</span>
      </a>
    </div>
  </header>

  <main class="container">
    <div class="control-card">
      <div class="select-group">
        <div class="select-label">เลือกบทเรียนที่ต้องการทำ:</div>
        <select class="custom-select" id="chapter-select" onchange="filterQuestions()">
          <option value="all">ทำข้อสอบทั้งหมด (คละบทเรียน 50 ข้อ)</option>
          <option value="1">บทที่ 1 สถิติ (2)</option>
          <option value="2">บทที่ 2 ความเท่ากันทุกประการ</option>
          <option value="3">บทที่ 3 เส้นขนาน</option>
          <option value="4">บทที่ 4 การให้เหตุผลทางเรขาคณิต</option>
          <option value="5">บทที่ 5 การแยกตัวประกอบของพหุนามดีกรีสอง</option>
        </select>
      </div>

      <div class="stats-group">
        <div class="stat-item">
          <div class="stat-label">ข้อที่</div>
          <div class="stat-value"><span id="current-index">1</span> / <span id="total-count">50</span></div>
        </div>
        <div class="divider"></div>
        <div class="stat-item">
          <div class="stat-label">คะแนนรวม</div>
          <div class="stat-value"><span id="score-count">0</span> คะแนน</div>
        </div>
      </div>
    </div>

    <div class="progress-bar-bg">
      <div class="progress-bar-fill" id="progress-bar"></div>
    </div>

    <div class="question-card">
      <div class="question-header">
        <span class="chapter-tag" id="question-chapter">บทเรียน</span>
        <span class="status-tag" id="question-status">ยังไม่ได้ตอบ</span>
      </div>

      <h2 class="question-text" id="question-title">กำลังโหลดโจทย์...</h2>
      <div class="options-list" id="options-container"></div>

      <div class="action-group">
        <button class="btn btn-submit" onclick="checkAnswer()">Check ตรวจคำตอบ</button>
        <button class="btn btn-random" onclick="loadRandomQuestion()">🎲 สุ่มโจทย์ข้อใหม่</button>
        <button class="btn btn-explain" id="btn-explain" onclick="toggleExplanation()">💡 ดูเฉลยรายละเอียด</button>
      </div>

      <div class="explanation-box" id="explanation-box">
        <div class="explanation-title">📌 เฉลยและวิธีทำอย่างละเอียด:</div>
        <div class="explanation-text" id="explanation-text"></div>
      </div>
    </div>
  </main>

  <script>
    // คลังข้อสอบ ม.2 เทอม 2 ครบทั้ง 5 บทเรียน จำนวน 50 ข้อ
    const questionBank = [
      // --- บทที่ 1 สถิติ (2) (ข้อ 1-10) ---
      { chapterId: 1, chapterName: "บทที่ 1 สถิติ (2)", title: "แผนภาพต้น-ใบ (Stem-and-Leaf Plot) เหมาะสำหรับการนำเสนอข้อมูลประเภทใดมากที่สุด?", options: ["A) ข้อมูลเชิงคุณภาพ", "B) ข้อมูลเชิงปริมาณที่มีจำนวนไม่มากเกินไป", "C) ข้อมูลที่มีการเปรียบเทียบเชิงพื้นที่", "D) ข้อมูลยอดขายรายปี"], correctIndex: 1, explain: "แผนภาพต้น-ใบช่วยรักษาข้อมูลดิบไว้ครบถ้วน เหมาะกับข้อมูลเชิงปริมาณขนาดเล็กถึงปานกลาง" },
      { chapterId: 1, chapterName: "บทที่ 1 สถิติ (2)", title: "แผนภาพกล่อง (Box Plot) ใช้วัดตำแหน่งของข้อมูลโดยแบ่งข้อมูลออกเป็นกี่ส่วนเท่าๆ กัน?", options: ["A) 2 ส่วน", "B) 3 ส่วน", "C) 4 ส่วน", "D) 10 ส่วน"], correctIndex: 2, explain: "แผนภาพกล่องอาศัยค่าควอร์ไทล์ (Q1, Q2, Q3) แบ่งข้อมูลออกเป็น 4 ส่วนเท่ากัน ส่วนละ 25%" },
      { chapterId: 1, chapterName: "บทที่ 1 สถิติ (2)", title: "ตำแหน่งของมัธยฐานในแผนภาพกล่องตรงกับค่าใด?", options: ["A) Q1", "B) Q2", "C) Q3", "D) ค่าต่ำสุด (Min)"], correctIndex: 1, explain: "มัธยฐานคือค่ากลางของข้อมูล ซึ่งตรงกับควอร์ไทล์ที่ 2 (Q2)" },
      { chapterId: 2, chapterName: "บทที่ 1 สถิติ (2)", title: "พิสัยควอร์ไทล์ (Interquartile Range: IQR) คำนวณได้จากสูตรใด?", options: ["A) Max - Min", "B) Q3 - Q1", "C) Q3 - Q2", "D) Q2 - Q1"], correctIndex: 1, explain: "พิสัยควอร์ไทล์ (IQR) หาได้จากผลต่างระหว่างควอร์ไทล์ที่ 3 กับควอร์ไทล์ที่ 1 (Q3 - Q1)" },
      { chapterId: 1, chapterName: "บทที่ 1 สถิติ (2)", title: "ถ้าข้อมูลมีชุดหนึ่งเรียงจากน้อยไปมาก: 3, 5, 7, 9, 11, 13, 15, 17 ค่า Q1 ตรงกับข้อใด?", options: ["A) 5", "B) 6", "C) 7", "D) 8"], correctIndex: 1, explain: "ข้อมูลมี 8 ตัว ครึ่งแรกคือ 3, 5, 7, 9 → ค่าเฉลี่ยของ 5 กับ 7 คือ (5+7)/2 = 6" },
      { chapterId: 1, chapterName: "บทที่ 1 สถิติ (2)", title: "ข้อใด ไม่ใช่ ค่าสถิติที่ใช้ในการสร้างแผนภาพกล่อง?", options: ["A) ค่าต่ำสุด (Min)", "B) ฐานนิยม (Mode)", "C) ควอร์ไทล์ที่ 1 (Q1)", "D) ค่าสูงสุด (Max)"], correctIndex: 1, explain: "แผนภาพกล่องใช้ 5 ตัวเลขหลักคือ Min, Q1, Q2 (มัธยฐาน), Q3, Max ไม่ได้ใช้ฐานนิยม" },
      { chapterId: 1, chapterName: "บทที่ 1 สถิติ (2)", title: "ในฮิสโทแกรม (Histogram) ความสูงของแต่ละแท่งสี่เหลี่ยมแทนสิ่งใด?", options: ["A) ขอบบน", "B) ความกว้างของอันตรภาคชั้น", "C) ความถี่ของข้อมูล", "D) จุดกลางชั้น"], correctIndex: 2, explain: "ความสูงของแต่ละแท่งในฮิสโทแกรมจะแปรผันตามความถี่ (Frequency) ของข้อมูลช่วงนั้นๆ" },
      { chapterId: 1, chapterName: "บทที่ 1 สถิติ (2)", title: "แผนภาพกล่องที่มีกล่องฝั่งขวายาวกว่าฝั่งซ้าย แสดงว่าข้อมูลมีลักษณะกระจายแบบใด?", options: ["A) กระจายเท่ากัน", "B) เบ้ขวา", "C) เบ้ซ้าย", "D) โค้งสมมาตร"], correctIndex: 1, explain: "ถ้าความยาวกล่องหรือหนวดแมวฝั่งขวายาวกว่า จะแสดงถึงข้อมูลที่กระจายตัวเบ้ไปทางขวา" },
      { chapterId: 1, chapterName: "บทที่ 1 สถิติ (2)", title: "การหาค่าตำแหน่ง Q3 ของข้อมูล N ตัวที่ไม่แจกแจงความถี่ ใช้สูตรตำแหน่งตรงกับข้อใด?", options: ["A) 3(N)/4", "B) 3(N+1)/4", "C) (N+1)/3", "D) 3(N-1)/4"], correctIndex: 1, explain: "สูตรตำแหน่งควอร์ไทล์ที่ r คือ Pos(Qr) = r(N+1)/4 ดังนั้น Q3 คือ 3(N+1)/4" },
      { chapterId: 1, chapterName: "บทที่ 1 สถิติ (2)", title: "ข้อมูลชุดหนึ่งมี Q1 = 12, Q3 = 28 ค่า IQR มีค่าเท่าใด?", options: ["A) 16", "B) 20", "C) 40", "D) 14"], correctIndex: 0, explain: "IQR = Q3 - Q1 = 28 - 12 = 16" },

      // --- บทที่ 2 ความเท่ากันทุกประการ (ข้อ 11-20) ---
      { chapterId: 2, chapterName: "บทที่ 2 ความเท่ากันทุกประการ", title: "สามเหลี่ยมสองรูปที่มีด้านยาวเท่ากันสามคู่ จะมีความสัมพันธ์แบบใด?", options: ["A) ด้าน-มุม-ด้าน (ด.ม.ด.)", "B) มุม-ด้าน-มุม (ม.ด.ม.)", "C) ด้าน-ด้าน-ด้าน (ด.ด.ด.)", "D) ฉาก-ด้าน-ด้าน (ฉ.ด.ด.)"], correctIndex: 2, explain: "เมื่อด้านยาวเท่ากันคู่ต่อคู่ครบทั้ง 3 ด้าน จะสัมพันธ์แบบ ด้าน-ด้าน-ด้าน (ด.ด.ด.)" },
      { chapterId: 2, chapterName: "บทที่ 2 ความเท่ากันทุกประการ", title: "ความสัมพันธ์แบบ ด้าน-มุม-ด้าน (ด.ม.ด.) มุมที่เท่ากันต้องมีลักษณะอย่างไร?", options: ["A) เป็นมุมแหลมเสมอ", "B) เป็นมุมที่อยู่ระหว่างด้านที่ยาวเท่ากันทั้งสองด้าน", "C) เป็นมุมฉากเท่านั้น", "D) เป็นมุมใดก็ได้ในสามเหลี่ยม"], correctIndex: 1, explain: "มุมที่เท่ากันต้องเป็น 'มุมในระหว่าง' (Included angle) ด้านคู่ที่ยาวเท่ากัน" },

    let currentQuestion = null;
    let selectedOptionIndex = null;
    let totalScore = 0;
    let isChecked = false;
    let currentIndexNum = 1;

    function loadRandomQuestion() {
      const selectedChapter = document.getElementById('chapter-select').value;
      let availableQuestions = questionBank;

      if (selectedChapter !== 'all') {
        availableQuestions = questionBank.filter(q => q.chapterId == selectedChapter);
      }

      if (availableQuestions.length === 0) {
        alert("ไม่พบโจทย์ในบทเรียนนี้");
        return;
      }

      const randomIndex = Math.floor(Math.random() * availableQuestions.length);
      currentQuestion = availableQuestions[randomIndex];

      selectedOptionIndex = null;
      isChecked = false;

      document.getElementById('question-chapter').innerText = currentQuestion.chapterName;
      document.getElementById('question-title').innerText = `${currentIndexNum}. ${currentQuestion.title}`;
      document.getElementById('question-status').innerText = 'ยังไม่ได้ตอบ';
      document.getElementById('question-status').style.backgroundColor = '#f1f5f9';
      document.getElementById('question-status').style.color = '#64748b';

      document.getElementById('btn-explain').style.display = 'none';
      document.getElementById('explanation-box').style.display = 'none';

      const container = document.getElementById('options-container');
      container.innerHTML = '';

      currentQuestion.options.forEach((optText, index) => {
        const item = document.createElement('label');
        item.className = 'option-item';
        item.onclick = () => selectOption(index);
        item.innerHTML = `
          <span class="option-text">${optText}</span>
          <div class="radio-circle"></div>
        `;
        container.appendChild(item);
      });
    }

    function selectOption(index) {
      if (isChecked) return;
      selectedOptionIndex = index;
      const items = document.querySelectorAll('.option-item');
      items.forEach((item, idx) => {
        if (idx === index) {
          item.classList.add('selected');
        } else {
          item.classList.remove('selected');
        }
      });
      document.getElementById('question-status').innerText = 'ตอบแล้ว';
      document.getElementById('question-status').style.backgroundColor = '#e0f2fe';
      document.getElementById('question-status').style.color = '#0369a1';
    }

    function checkAnswer() {
      if (selectedOptionIndex === null) {
        alert("กรุณาเลือกคำตอบก่อนกดตรวจครับ!");
        return;
      }

      if (isChecked) return;
      isChecked = true;

      const items = document.querySelectorAll('.option-item');
      items.forEach(item => item.classList.add('disabled'));

      const isCorrect = (selectedOptionIndex === currentQuestion.correctIndex);

      if (isCorrect) {
        items[selectedOptionIndex].classList.add('correct');
        totalScore += 1;
        document.getElementById('score-count').innerText = totalScore;
        document.getElementById('question-status').innerText = 'ถูกต้อง! (+1)';
        document.getElementById('question-status').style.backgroundColor = '#dcfce7';
        document.getElementById('question-status').style.color = '#166534';
      } else {
        items[selectedOptionIndex].classList.add('wrong');
        items[currentQuestion.correctIndex].classList.add('correct');
        document.getElementById('question-status').innerText = 'ตอบผิด';
        document.getElementById('question-status').style.backgroundColor = '#fee2e2';
        document.getElementById('question-status').style.color = '#991b1b';
      }

      document.getElementById('btn-explain').style.display = 'inline-flex';
      document.getElementById('explanation-text').innerHTML = currentQuestion.explain;

      currentIndexNum = (currentIndexNum % 50) + 1;
      document.getElementById('current-index').innerText = currentIndexNum;
      document.getElementById('progress-bar').style.width = `${(currentIndexNum / 50) * 100}%`;
    }

    function toggleExplanation() {
      const box = document.getElementById('explanation-box');
      box.style.display = (box.style.display === 'block') ? 'none' : 'block';
    }

    function filterQuestions() {
      loadRandomQuestion();
    }

    window.onload = loadRandomQuestion;
  </script>
