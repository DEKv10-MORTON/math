<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DEK MORTON STUDIO - ฝึกกระจายกำลังสองสมบูรณ์</title>
    <link rel="stylesheet" href="../ads-style.css">
    <script src="../ads-script.js"></script>
    <style>
        body {
            font-family: 'Tahoma', sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            padding: 20px;
            text-align: center;
        }

        .brand-logo {
            font-size: 14px;
            font-weight: 800;
            letter-spacing: 3px;
            color: #00d2d3;
            text-transform: uppercase;
            margin-bottom: 5px;
            text-shadow: 0 0 8px rgba(0, 210, 211, 0.4);
        }

        .card {
            background: #1e1e1e;
            max-width: 520px;
            margin: 0 auto;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.5);
            border: 1px solid #2d2d2d;
        }

        .problem-box {
            background-color: #2a2a2a;
            border: 2px dashed #00d2d3;
            border-radius: 10px;
            padding: 20px;
            margin: 20px 0;
        }

        .problem {
            font-size: 34px;
            font-weight: bold;
            color: #ffffff;
        }

        .formula-box {
            background-color: #111;
            padding: 12px;
            border-radius: 8px;
            font-size: 15px;
            color: #ff9ff3;
            margin-bottom: 20px;
            border: 1px solid #333;
        }

        button {
            background-color: #00d2d3;
            color: #121212;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            margin: 5px;
            transition: 0.2s;
        }

        button:hover {
            background-color: #48dbfb;
            box-shadow: 0 0 10px rgba(72, 219, 251, 0.4);
        }

        .btn-step {
            background-color: #10ac84;
            color: white;
        }

        .btn-step:hover {
            background-color: #1dd1a1;
            box-shadow: 0 0 10px rgba(29, 209, 161, 0.4);
        }

        .step-box {
            background-color: #252525;
            border-left: 5px solid #10ac84;
            padding: 15px;
            margin-top: 15px;
            text-align: left;
            line-height: 1.8;
            font-size: 17px;
            display: none;
            border-radius: 4px;
        }

        .highlight-green {
            font-weight: bold;
            color: #1dd1a1;
        }

        .highlight-yellow {
            font-weight: bold;
            color: #feca57;
        }

        .highlight-red {
            font-weight: bold;
            color: #ff6b6b;
        }

        sup {
            font-size: 0.7em;
        }
    </style>
</head>

<body>

    <div class="card">
        <div class="brand-logo">⚡ DEK MORTON STUDIO</div>
        <h2>🎯 ฝึกกระจาย (น ± ล)²</h2>

        <div class="formula-box">
            💡 สูตรท่องจำ: <b>(น ± ล)² = น² ± 2นล + ล²</b>
        </div>

        <div class="problem-box">
            <div class="problem" id="problem-text">(x + 7)²</div>
        </div>

        <button onclick="generateProblem()">🎲 สุ่มโจทย์ใหม่</button>
        <button class="btn-step" onclick="showNextStep()">💡 ดูการกระจายทีละสเต็ป</button>

        <div id="steps-container"></div>
    </div>

    <script>
        let currentProblem = {};
        let currentStep = 0;

        // สุ่มสร้างโจทย์ประเภท (Ax ± B)²
        function generateProblem() {
            currentStep = 0;
            document.getElementById('steps-container').innerHTML = '';

            // สุ่มตัวหน้า (A) เช่น 1, 2, 3, 4, 5
            const A = Math.random() < 0.6 ? 1 : Math.floor(Math.random() * 4) + 2;
            // สุ่มตัวหลัง (B) เช่น 1 ถึง 12
            const B = Math.floor(Math.random() * 12) + 1;
            // สุ่มเครื่องหมาย + หรือ -
            const isPlus = Math.random() < 0.5;

            currentProblem = { A, B, isPlus };

            // จัดรูปแสดงผลโจทย์ เช่น (x + 7)² หรือ (2x - 5)²
            const AText = A === 1 ? '' : A;
            const signText = isPlus ? '+' : '-';

            document.getElementById('problem-text').innerHTML = `(${AText}x ${signText} ${B})²`;
        }

        function showNextStep() {
            const { A, B, isPlus } = currentProblem;
            const signText = isPlus ? '+' : '-';

            const AText = A === 1 ? '' : A;
            const termN = `${AText}x`; // พจน์หน้า
            const termL = `${B}`;      // พจน์หลัง

            // คำนวณค่าตัวเลข
            const n2_coef = A * A;
            const n2_text = n2_coef === 1 ? '' : n2_coef;

            const mid_coef = 2 * A * B;
            const l2_val = B * B;

            const steps = [
                `<b>สเต็ป 1: ระบุ "หน้า" และ "หลัง" ให้ชัดเจน</b><br>` +
                `👉 ตัวหน้า (น) = <span class="highlight-green">${termN}</span><br>` +
                `👉 ตัวหลัง (ล) = <span class="highlight-yellow">${termL}</span>`,

                `<b>สเต็ป 2: แทนค่าลงในสูตร  น² ${signText} 2นล + ล²</b><br>` +
                `👉 = <span class="highlight-green">(${termN})²</span> ${signText} <span class="highlight-red">2(${termN})(${termL})</span> + <span class="highlight-yellow">(${termL})²</span>`,

                `<b>คำตอบสุดท้าย: คำนวณหาผลลัพธ์</b><br>` +
                `👉 <span style="font-size: 22px; color: #00d2d3; font-weight: bold;">${n2_text}x² ${signText} ${mid_coef}x + ${l2_val}</span><br>` +
                `*(ระวัง! เครื่องหมายพจน์ท้ายสุดเป็น <span class="highlight-yellow">+${l2_val}</span> เสมอ)*`
            ];

            if (currentStep < steps.length) {
                const stepDiv = document.createElement('div');
                stepDiv.className = 'step-box';
                stepDiv.style.display = 'block';
                stepDiv.innerHTML = steps[currentStep];
                document.getElementById('steps-container').appendChild(stepDiv);
                currentStep++;
            }
        }

        // เริ่มต้นระบบ
        generateProblem();
    </script>

</body>

</html>
