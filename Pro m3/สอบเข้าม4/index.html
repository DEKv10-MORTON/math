<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>คณิตศาสตร์ สอบเข้า ม.4 - DEK MORTON STUDIO</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Font Awesome สำหรับไอคอน YouTube -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="card">
        <!-- ปุ่มติวเตอร์ YouTube ลอยอยู่มุมขวาบน -->
        <a href="https://www.youtube.com/watch?v=1WWs1VLjXjI" target="_blank" class="yt-btn-corner">
            <i class="fa-brands fa-youtube" style="font-size: 16px;"></i>
            <span>ติวเตอร์ YouTube</span>
        </a>

        <div class="title">📐 แนวข้อสอบคณิตศาสตร์ สอบเข้า ม.4</div>
        <div class="brand">DEK MORTON STUDIO • High School Math Entrance Drill</div>

        <!-- สรุปหัวข้อสำคัญ -->
        <div class="summary-box">
            <div class="summary-title">📌 เจาะลึกคณิตศาสตร์ ม.ต้น ระดับแข่งขัน:</div>
            <div class="summary-tags">
                <span>พหุนามและแยกตัวประกอบ</span>
                <span>ระบบสมการและอสมการ</span>
                <span>เรขาคณิตและวงกลม</span>
                <span>ฟังก์ชันและพาราโบลา</span>
                <span>ตรีโกณมิติประยุกต์</span>
                <span>ความน่าจะเป็นเชิงลึก</span>
            </div>
        </div>

        <div class="question-box" id="questionText">กำลังโหลดโจทย์...</div>

        <div class="btn-grid" id="btnGroup"></div>

        <div class="feedback" id="feedback"></div>

        <div class="actions">
            <button class="btn-next" onclick="generateRandomQuestion()">สุ่มโจทย์ข้อถัดไป 🎲</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
